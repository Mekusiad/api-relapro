services:
  - type: web
    name: backend-easyplant
    env: node
    plan: free
    buildCommand: npm install && npx prisma generate
    startCommand: node src/server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: relapro-db
          property: connectionString
      - key: ADMIN_NOME
        value: Administrador
      - key: ADMIN_MATRICULA
        value: 0001
      - key: ADMIN_USUARIO
        value: admin
      - key: ADMIN_SENHA
        value: senhaForte123
      - key: ADMIN_CARGO
        value: Gerente
